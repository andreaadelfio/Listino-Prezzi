<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listino Prezzi</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/styles.css?v=20260326-5">
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay hidden" aria-hidden="true">
      <div class="loading-overlay-card" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span id="loading-overlay-label">Caricamento...</span>
      </div>
    </div>

    <button
      id="scroll-to-top-button"
      class="scroll-to-top-button hidden"
      type="button"
      aria-label="Torna all'inizio della pagina"
      title="Torna su"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5l7 7-1.41 1.41L13 8.83V20h-2V8.83l-4.59 4.58L5 12z"/>
      </svg>
    </button>

    <div class="page-shell">
      
      <main class="main-grid">
        <section id="listino-panel" class="panel">
          <div class="panel-head">
            <div class="panel-title-row">
              <div class="panel-title-main">
                <div class="panel-owner-inline">
                  <p class="eyebrow">Listino Prezzi</p>
                  <div class="field owner-field">
                    <div id="owner-dropdown" class="custom-dropdown">
                      <button
                        id="owner-dropdown-button"
                        class="custom-dropdown-trigger"
                        type="button"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                      >
                        <span id="owner-dropdown-label">Seleziona o crea owner</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M7 10l5 5 5-5z"/>
                        </svg>
                      </button>
                      <div id="owner-dropdown-panel" class="custom-dropdown-panel hidden">
                        <input id="owner-dropdown-search" type="search" placeholder="Cerca o crea owner">
                        <div id="owner-dropdown-options" class="custom-dropdown-options" role="listbox" aria-label="Owner disponibili"></div>
                      </div>
                    </div>
                  </div>
                </div>
                <div id="feedback" class="feedback feedback-inline hidden"></div>
              </div>
              <p id="owner-status" class="field-help owner-inline-status">Caricamento owner dal database...</p>
            </div>
            <div class="table-toolbar">
              <button id="refresh-button" class="icon-button" type="button" aria-label="Aggiorna listino" title="Aggiorna listino">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 12.65-5.65z"/>
                </svg>
              </button>
              <span id="table-counter" class="pill">0 prodotti</span>
            </div>
          </div>


          <div class="alphabet-index-wrap">
            <div id="alphabet-index" class="alphabet-index" aria-label="Indice alfabetico prodotti"></div>
          </div>

          <form id="price-form"></form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="selection-head" aria-label="Selezione">
                    <input
                      id="select-all-checkbox"
                      class="row-selection-checkbox master-selection-checkbox"
                      type="checkbox"
                      aria-label="Seleziona o deseleziona tutti i prodotti visibili"
                    >
                  </th>
                  <th class="sort-head" data-sort-column="prodotto" aria-sort="ascending">
                    <button type="button" class="sort-button sort-button-active" data-sort-key="prodotto" aria-pressed="true">
                      <span>Prodotto</span>
                      <span class="sort-indicator" aria-hidden="true">↑</span>
                    </button>
                  </th>
                  <th class="sort-head" data-sort-column="rivenditore" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="rivenditore" aria-pressed="false">
                      <span>Rivenditore</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th class="sort-head" data-sort-column="categoria" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="categoria" aria-pressed="false">
                      <span>Categoria</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th class="sort-head" data-sort-column="prezzo" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="prezzo" aria-pressed="false">
                      <span>Prezzo</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>Azioni</th>
                </tr>
              </thead>
              <tbody class="entry-body">
                <tr id="entry-row" class="entry-row">
                  <td class="entry-selection-cell" aria-hidden="true">
                <span class="entry-selection-placeholder"></span>
                  </td>
                  <td data-label="Prodotto">
                <input form="price-form" name="prodotto" type="search" placeholder="Cerca o aggiungi..." required>
                  </td>
                  <td data-label="Rivenditore">
                <div class="rivenditore-picker">
                  <input id="rivenditore-hidden-input" name="retailer_id" type="hidden" form="price-form">
                  <div id="rivenditore-dropdown" class="custom-dropdown">
                    <button
                      id="rivenditore-dropdown-button"
                      class="custom-dropdown-trigger"
                      type="button"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                    >
                      <span id="rivenditore-dropdown-label">Rivenditore</span>
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 10l5 5 5-5z"/>
                      </svg>
                    </button>
                    <div id="rivenditore-dropdown-panel" class="custom-dropdown-panel hidden">
                      <input id="rivenditore-dropdown-search" type="search" placeholder="Cerca o crea rivenditore">
                      <div id="rivenditore-dropdown-options" class="custom-dropdown-options" role="listbox" aria-label="Rivenditore disponibili"></div>
                    </div>
                  </div>
                </div>
                  </td>
                  <td data-label="Categoria">
                <div class="category-picker">
                  <input id="category-hidden-input" name="categoria" type="hidden" form="price-form">
                  <div id="category-dropdown" class="custom-dropdown">
                    <button
                      id="category-dropdown-button"
                      class="custom-dropdown-trigger"
                      type="button"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                    >
                      <span id="category-dropdown-label">Categoria</span>
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 10l5 5 5-5z"/>
                      </svg>
                    </button>
                    <div id="category-dropdown-panel" class="custom-dropdown-panel hidden">
                      <input id="category-dropdown-search" type="search" placeholder="Cerca o crea categoria">
                      <div id="category-dropdown-options" class="custom-dropdown-options" role="listbox" aria-label="Categorie disponibili"></div>
                    </div>
                  </div>
                </div>
                  </td>
                  <td data-label="Prezzo">
                <input form="price-form" name="prezzo" type="text" placeholder="Es. 1€/l" required>
                  </td>
                  <td class="entry-actions-cell" data-label="Azioni">
                <div class="entry-actions">
                  <div class="entry-button-row">
                    <button id="price-submit-button" class="primary-button compact-button icon-button" type="submit" form="price-form">Salva</button>
                    <button id="price-reset-filters-button" class="icon-button" type="button" aria-label="Resetta filtri" title="Resetta filtri">×</button>
                    <button id="price-cancel-button" class="secondary-button compact-button hidden" type="button">Annulla</button>
                  </div>
                </div>
                  </td>
                </tr>
              </tbody>
              <tbody id="rows-body">
                <tr>
                  <td colspan="6">Caricamento...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div id="selected-rows-box" class="selection-panel hidden reduced" aria-live="polite">
            <div class="selection-box-head">
              <div class="selection-box-title">
                <p class="eyebrow">Selezionati</p>
                <button id="selected-rows-copy-button" class="secondary-button compact-button" type="button">Copia</button>
              </div>
              <div class="selection-box-actions">
                <button
                  id="selected-rows-clear-button"
                  class="icon-button icon-button-danger hidden"
                  type="button"
                  aria-label="Rimuovi solo i selezionati barrati"
                  title="Rimuovi solo i selezionati barrati"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v8h-2V9zm4 0h2v8h-2V9zM7 9h2v8H7V9zm-1 12a2 2 0 0 1-2-2V8h16v11a2 2 0 0 1-2 2H6z"/>
                  </svg>
                </button>
                <button id="selected-rows-toggle-size" class="icon-button" type="button">↑</button>
                <span id="selected-rows-count" class="pill">0 selezionati</span>
              </div>
            </div>
            <pre id="selected-rows-list" class="selection-plain-list"></pre>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/config.js?v=20260326-5"></script>
    <script src="./assets/app.js?v=20260326-5"></script>
  </body>
</html>

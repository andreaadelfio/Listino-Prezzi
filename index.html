<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listino Prezzi Raw</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/styles.css?v=20260316-23">
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <h1>Listino Prezzi</h1>
        </div>
        <div class="hero-meta">
          <div class="owner-inline">
            <label class="field owner-field">
              <span>Owner</span>
              <select id="owner-select" disabled>
                <option value="">Caricamento owner...</option>
              </select>
            </label>
            <p id="owner-status" class="field-help owner-inline-status">Caricamento owner dal database...</p>
          </div>
        </div>
      </header>

      <main class="main-grid">
        <section class="panel panel-wide">
          <div class="panel-head">
            <div class="panel-title-row">
              <div>
                <p class="eyebrow">Listino Prezzi</p>
                <h2>Ricerca e inserimento nella tabella</h2>
              </div>
              <div id="feedback" class="feedback feedback-inline hidden"></div>
            </div>
            <div class="table-toolbar">
              <button id="refresh-button" class="icon-button" type="button" aria-label="Aggiorna listino" title="Aggiorna listino">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 12.65-5.65z"/>
                </svg>
              </button>
              <span id="table-counter" class="pill">0 prodotti</span>
            </div>
          </div>

          <div class="table-controls">
            <div class="table-search-row">
              <label class="field table-search-field">
                <span>Ricerca</span>
                <input id="search-input" type="search" placeholder="Cerca in tutto: prodotto, rivenditore, categoria, prezzo">
              </label>
              <button
                id="advanced-toggle-button"
                class="secondary-button advanced-toggle-button"
                type="button"
                aria-expanded="false"
              >
                Advanced
              </button>
            </div>

            <div id="advanced-filters" class="advanced-filters hidden">
              <label class="field">
                <span>Rivenditore</span>
                <select id="rivenditore-filter">
                  <option value="">Tutti</option>
                </select>
              </label>

              <label class="field">
                <span>Categoria</span>
                <select id="category-filter">
                  <option value="">Tutte</option>
                </select>
              </label>
            </div>
          </div>

          <form id="price-form"></form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Prodotto</th>
                  <th>Rivenditore</th>
                  <th>Categoria</th>
                  <th>Prezzo</th>
                  <th>Azioni</th>
                </tr>
              </thead>
              <tbody class="entry-body">
                <tr id="entry-row" class="entry-row">
                  <td>
                    <input form="price-form" name="prodotto" type="text" placeholder="Es. Avena" required>
                  </td>
                  <td>
                    <div class="rivenditore-picker">
                      <input id="rivenditore-hidden-input" name="retailer_id" type="hidden" form="price-form">
                      <div id="rivenditore-dropdown" class="custom-dropdown">
                        <button
                          id="rivenditore-dropdown-button"
                          class="custom-dropdown-trigger"
                          type="button"
                          aria-haspopup="listbox"
                          aria-expanded="false"
                        >
                          <span id="rivenditore-dropdown-label">Rivenditore</span>
                          <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 10l5 5 5-5z"/>
                          </svg>
                        </button>
                        <div id="rivenditore-dropdown-panel" class="custom-dropdown-panel hidden">
                          <input id="rivenditore-dropdown-search" type="search" placeholder="Cerca o crea rivenditore">
                          <div id="rivenditore-dropdown-options" class="custom-dropdown-options" role="listbox" aria-label="Rivenditore disponibili"></div>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <div class="category-picker">
                      <input id="category-hidden-input" name="categoria" type="hidden" form="price-form">
                      <div id="category-dropdown" class="custom-dropdown">
                        <button
                          id="category-dropdown-button"
                          class="custom-dropdown-trigger"
                          type="button"
                          aria-haspopup="listbox"
                          aria-expanded="false"
                        >
                          <span id="category-dropdown-label">Categoria</span>
                          <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 10l5 5 5-5z"/>
                          </svg>
                        </button>
                        <div id="category-dropdown-panel" class="custom-dropdown-panel hidden">
                          <input id="category-dropdown-search" type="search" placeholder="Cerca o crea categoria">
                          <div id="category-dropdown-options" class="custom-dropdown-options" role="listbox" aria-label="Categorie disponibili"></div>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <input form="price-form" name="prezzo" type="text" placeholder="Es. 1EUR/l o 7.35EUR/kg" required>
                  </td>
                  <td class="entry-actions-cell">
                    <div class="entry-actions">
                      <div class="entry-button-row">
                        <button id="price-submit-button" class="primary-button compact-button" type="submit" form="price-form">Salva</button>
                        <button id="price-cancel-button" class="secondary-button compact-button hidden" type="button">Annulla</button>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
              <tbody id="rows-body">
                <tr>
                  <td colspan="5">Caricamento...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/config.js?v=20260316-23"></script>
    <script src="./assets/app.js?v=20260316-23"></script>
  </body>
</html>

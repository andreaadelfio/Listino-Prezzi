<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listino Prezzi Raw</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/styles.css?v=20260316-17">
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <h1>Listino Prezzi</h1>
        </div>
      </header>

      <main class="main-grid">
        <section class="panel panel-wide">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Filtri</p>
              <h2>Esplora il listino</h2>
            </div>
          </div>

          <div class="filter-grid">
            <label class="field">
              <span>Cerca prodotto o prezzo</span>
              <input id="search-input" type="search" placeholder="Es. avena, kg, 2.9">
            </label>

            <label class="field">
              <span>Retailer</span>
              <select id="retailer-filter">
                <option value="">Tutti</option>
              </select>
            </label>

            <label class="field">
              <span>Categoria</span>
              <select id="category-filter">
                <option value="">Tutte</option>
              </select>
            </label>
          </div>
        </section>

        <section class="panel panel-wide">
          <div class="panel-head">
            <div>
              <p id="price-form-eyebrow" class="eyebrow">Nuova riga</p>
              <h2 id="price-form-title">Inserisci voce listino raw</h2>
            </div>
          </div>

          <form id="price-form" class="form-grid">
            <label class="field">
              <span>Prodotto</span>
              <input name="prodotto" type="text" placeholder="Es. Avena" required>
            </label>

            <label class="field">
              <span>Retailer</span>
              <div class="retailer-picker">
                <input id="retailer-hidden-input" name="retailer_id" type="hidden">
                <div id="retailer-dropdown" class="custom-dropdown">
                  <button
                    id="retailer-dropdown-button"
                    class="custom-dropdown-trigger"
                    type="button"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                  >
                    <span id="retailer-dropdown-label">Seleziona retailer</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M7 10l5 5 5-5z"/>
                    </svg>
                  </button>
                  <div id="retailer-dropdown-panel" class="custom-dropdown-panel hidden">
                    <input id="retailer-dropdown-search" type="search" placeholder="Cerca o crea retailer">
                    <div id="retailer-dropdown-options" class="custom-dropdown-options" role="listbox" aria-label="Retailer disponibili"></div>
                  </div>
                </div>
                <p class="field-help">Se la ricerca non trova nulla, il testo digitato verra creato quando salvi la riga.</p>
              </div>
            </label>

            <label class="field">
              <span>Categoria</span>
              <select id="price-category-select" name="categoria">
                <option value="">Seleziona categoria</option>
              </select>
            </label>

            <label class="field">
              <span>Prezzo</span>
              <input name="prezzo" type="text" placeholder="Es. 1EUR/l oppure 7.35EUR/kg" required>
            </label>

            <div class="form-actions">
              <div class="form-button-row">
                <button id="price-submit-button" class="primary-button" type="submit">Salva riga</button>
                <button id="price-cancel-button" class="secondary-button hidden" type="button">Annulla modifica</button>
              </div>
              <p id="price-form-note" class="form-note">La combinazione prodotto-retailer viene gestita automaticamente.</p>
            </div>
          </form>
        </section>

        <section class="panel panel-wide">
          <div class="panel-head">
            <div class="panel-title-row">
              <p class="eyebrow">Listino Prezzi</p>
            </div>
            <div class="table-toolbar">
              <button id="refresh-button" class="icon-button" type="button" aria-label="Aggiorna listino" title="Aggiorna listino">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 12.65-5.65z"/>
                </svg>
              </button>
              <span id="table-counter" class="pill">0 prodotti</span>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Prodotto</th>
                  <th>Rivenditore</th>
                  <th>Categoria</th>
                  <th>Prezzo</th>
                  <th>Azioni</th>
                </tr>
              </thead>
              <tbody id="rows-body">
                <tr>
                  <td colspan="5">Caricamento...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/config.js?v=20260316-17"></script>
    <script src="./assets/app.js?v=20260316-17"></script>
  </body>
</html>
